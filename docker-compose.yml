name: metricring
services:
  app:
    build: .
    container_name: metricring-app
    ports: ["${APP_PORT:-18215}:8000"]
    environment:
      - APP_PORT=${APP_PORT:-18215}
      - METRICRING_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - metricring-data:/app/data
volumes:
  metricring-data:
